name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # 최신 스테이블 버전 사용
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Web
        run: |
          cd frontend
          # --no-tree-shake-icons: 아이콘 깨짐 방지
          # --web-renderer canvaskit: 렌더링 일관성 확보
          flutter build web --release --no-tree-shake-icons --web-renderer canvaskit

          # Vercel의 Root Directory 설정(frontend)과 맞추기 위해 dist/frontend 구조 생성
          mkdir -p ../dist/frontend
          cp -r build/web/* ../dist/frontend/
          cp vercel.json ../dist/frontend/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dist
          vercel-args: '--prod'

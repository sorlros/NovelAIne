services:
  - type: web
    name: novelaine-backend
    env: python
    region: singapore
    plan: free # 무료 티어 사용
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SUPABASE_URL
        sync: false # Render 대시보드에서 직접 입력 필요
      - key: SUPABASE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
